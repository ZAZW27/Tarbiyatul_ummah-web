openapi: 3.0.3
info:
    title: LKSA Tarbiyatul Ummah API
    description: Backend API contract for Marketplace, Media Gallery, Transactions, and Admin Management.
    version: 1.0.0
servers:
    - url: http://localhost:3000
      description: Local Development Server

paths:
    # ----------------------------------------------------
    # AUTHENTICATION
    # ----------------------------------------------------
    /api/auth/login:
        post:
            summary: Admin Login
            tags:
                - Auth
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                '200':
                    description: Login successful.
                    headers:
                        Set-Cookie:
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthSuccessResponse'
                '401':
                    description: Invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

    /api/auth/logout:
        post:
            summary: Admin Logout
            tags:
                - Auth
            security:
                - cookieAuth: []
            responses:
                '200':
                    description: Logged out successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessResponse'

    # ----------------------------------------------------
    # PUBLIC MARKETPLACE (VIEW & PROCEDURE)
    # ----------------------------------------------------
    /api/market:
        get:
            summary: Fetch Active Market Catalog
            description: Returns available items directly from the vw_market_catalog database view.
            tags:
                - Public - Market
            responses:
                '200':
                    description: List of market items currently in stock.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/MarketCatalogItem'
                '500':
                    description: Database query failure.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

    /api/market/purchase:
        post:
            summary: Purchase Market Item
            description: Executes the process_purchase stored procedure to deduct stock, record transaction, and update cash balance with atomic rollback protection.
            tags:
                - Public - Market
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PurchaseRequest'
            responses:
                '200':
                    description: Purchase executed successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessResponse'
                '400':
                    description: Validation error or insufficient stock.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

    # ----------------------------------------------------
    # PUBLIC MEDIA GALLERY
    # ----------------------------------------------------
    /api/media:
        get:
            summary: Fetch Media Gallery
            description: Returns active documentation and activity photos.
            tags:
                - Public - Media
            parameters:
                - in: query
                  name: category_id
                  schema:
                      type: integer
                  description: Filter media by specific category ID.
            responses:
                '200':
                    description: List of media gallery items.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Item'
                '500':
                    description: Server error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

    # ----------------------------------------------------
    # ADMIN INVENTORY MANAGEMENT (RAW ITEMS TABLE)
    # ----------------------------------------------------
    /api/items:
        get:
            summary: Fetch All Items (Admin View)
            description: Returns all items regardless of stock or status (active, sold, hidden).
            tags:
                - Admin - Items
            security:
                - cookieAuth: []
            responses:
                '200':
                    description: Complete list of all items.
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Item'

        post:
            summary: Create Item
            description: Uploads image to storage and inserts item row into PostgreSQL. Triggers audit log if configured.
            tags:
                - Admin - Items
            security:
                - cookieAuth: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/ItemCreateRequest'
            responses:
                '201':
                    description: Item created successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Item'
                '400':
                    description: Invalid payload or constraint violation.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

    /api/items/{id}:
        get:
            summary: Get Single Item
            tags:
                - Admin - Items
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: integer
            responses:
                '200':
                    description: Item details.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Item'
                '404':
                    description: Item not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

        put:
            summary: Update Item
            description: Updates item details. Fires the trg_audit_items trigger on Postgres to log OLD state into audit_logs.
            tags:
                - Admin - Items
            security:
                - cookieAuth: []
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ItemUpdateRequest'
            responses:
                '200':
                    description: Item updated successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessResponse'
                '400':
                    description: Validation error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

        delete:
            summary: Delete Item
            description: Deletes row from database and logs action to audit_logs.
            tags:
                - Admin - Items
            security:
                - cookieAuth: []
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: integer
            responses:
                '200':
                    description: Item deleted successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessResponse'
                '400':
                    description: Foreign key restriction (e.g. item has transaction history).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

# ----------------------------------------------------
# COMPONENTS & SCHEMAS
# ----------------------------------------------------
components:
    securitySchemes:
        cookieAuth:
            type: apiKey
            in: cookie
            name: admin_session

    schemas:
        LoginRequest:
            type: object
            required:
                - username
                - password
            properties:
                username:
                    type: string
                password:
                    type: string

        AuthSuccessResponse:
            type: object
            properties:
                success:
                    type: boolean
                message:
                    type: string

        MarketCatalogItem:
            type: object
            properties:
                item_id:
                    type: integer
                title:
                    type: string
                category:
                    type: string
                price:
                    type: number
                stock:
                    type: integer
                image_url:
                    type: string

        PurchaseRequest:
            type: object
            required:
                - itemId
                - quantity
            properties:
                itemId:
                    type: integer
                    minimum: 1
                quantity:
                    type: integer
                    minimum: 1

        Item:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                description:
                    type: string
                    nullable: true
                price:
                    type: number
                    nullable: true
                stock:
                    type: integer
                category_id:
                    type: integer
                image_url:
                    type: string
                status:
                    type: string
                    enum: [active, sold, hidden]
                create_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time

        ItemCreateRequest:
            type: object
            required:
                - title
                - category_id
                - image
            properties:
                title:
                    type: string
                description:
                    type: string
                price:
                    type: number
                    description: Set for market items, null for media items.
                stock:
                    type: integer
                    default: 0
                category_id:
                    type: integer
                status:
                    type: string
                    enum: [active, sold, hidden]
                    default: active
                image:
                    type: string
                    format: binary

        ItemUpdateRequest:
            type: object
            properties:
                title:
                    type: string
                description:
                    type: string
                price:
                    type: number
                stock:
                    type: integer
                category_id:
                    type: integer
                image_url:
                    type: string
                status:
                    type: string
                    enum: [active, sold, hidden]

        SuccessResponse:
            type: object
            properties:
                message:
                    type: string

        ErrorResponse:
            type: object
            properties:
                error:
                    oneOf:
                        - type: string
                        - type: array
                          items:
                              type: string
