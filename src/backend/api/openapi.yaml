openapi: 3.0.3
info:
    title: LKSA Tarbiyatul Ummah API
    description: Backend API contract for Marketplace, Media Gallery, Transactions, and Admin Management.
    version: 1.0.0
servers:
    - url: http://localhost:5000
      description: Local Development Server

paths:
    /api/auth/login:
        post:
            summary: Admin Login
            tags:
                - Auth
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                '200':
                    description: Login successful.
                    headers:
                        Set-Cookie:
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AuthSuccessResponse'
                '401':
                    description: Invalid credentials.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

    /api/auth/logout:
        post:
            summary: Admin Logout
            tags:
                - Auth
            security:
                - cookieAuth: []
            responses:
                '200':
                    description: Logged out successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessResponse'

    /api/market:
        get:
            summary: Fetch Active Market Catalog
            description: Returns available items directly from the vw_market_catalog database view.
            tags:
                - Public - Market
            parameters:
                - in: query
                  name: page
                  schema:
                      type: integer
                      default: 1
                  description: 'UNCONFIRMED — verify backend reads this. Page number for pagination.'
                - in: query
                  name: limit
                  schema:
                      type: integer
                      default: 10
                  description: 'UNCONFIRMED — verify backend reads this. Page size.'
                - in: query
                  name: categories
                  schema:
                      type: array
                      items:
                          type: string
                  style: form
                  explode: true
                  description: 'UNCONFIRMED — verify backend reads this and its exact shape (array vs single id).'
            responses:
                '200':
                    description: List of market items currently in stock.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/MarketCatalogListResponse'
                '500':
                    description: Database query failure.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

    /api/market/purchase:
        post:
            summary: Purchase Market Item
            description: Executes the process_purchase stored procedure to deduct stock, record transaction, and update cash balance with atomic rollback protection.
            tags:
                - Public - Market
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/PurchaseRequest'
            responses:
                '200':
                    description: Purchase executed successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessResponse'
                '400':
                    description: Validation error or insufficient stock.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

    # ----------------------------------------------------
    # PUBLIC MEDIA GALLERY
    # ----------------------------------------------------
    /api/media:
        get:
            summary: Fetch Media Gallery
            description: Returns active documentation and activity photos.
            tags:
                - Public - Media
            parameters:
                - in: query
                  name: category_id
                  schema:
                      type: integer
                  description: Filter media by specific category ID.
            responses:
                '200':
                    description: List of media gallery items.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ItemListResponse'
                '500':
                    description: Server error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

    /api/items:
        get:
            summary: Fetch All Items (Admin View)
            description: Returns all items regardless of stock or status (active, sold, hidden).
            tags:
                - Admin - Items
            security:
                - cookieAuth: []
            responses:
                '200':
                    description: Complete list of all items.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ItemListResponse'

        post:
            summary: Create Item
            description: Uploads image to storage and inserts item row into PostgreSQL. Triggers audit log if configured.
            tags:
                - Admin - Items
            security:
                - cookieAuth: []
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/ItemCreateRequest'
            responses:
                '201':
                    description: Item created successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ItemResponse'
                '400':
                    description: Invalid payload or constraint violation.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

    /api/items/{id}:
        get:
            summary: Get Single Item
            tags:
                - Admin - Items
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: integer
            responses:
                '200':
                    description: Item details.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ItemResponse'
                '404':
                    description: Item not found.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

        put:
            summary: Update Item
            description: Updates item details. Fires the trg_audit_items trigger on Postgres to log OLD state into audit_logs.
            tags:
                - Admin - Items
            security:
                - cookieAuth: []
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: integer
            requestBody:
                required: true
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/ItemUpdateRequest'
            responses:
                '200':
                    description: Item updated successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessResponse'
                '400':
                    description: Validation error.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

        delete:
            summary: Delete Item
            description: Deletes row from database and logs action to audit_logs.
            tags:
                - Admin - Items
            security:
                - cookieAuth: []
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: integer
            responses:
                '200':
                    description: Item deleted successfully.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SuccessResponse'
                '400':
                    description: Foreign key restriction (e.g. item has transaction history).
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'

components:
    securitySchemes:
        cookieAuth:
            type: apiKey
            in: cookie
            name: admin_session

    schemas:
        LoginRequest:
            type: object
            required:
                - username
                - password
            properties:
                username:
                    type: string
                password:
                    type: string

        AuthSuccessResponse:
            type: object
            properties:
                success:
                    type: boolean
                message:
                    type: string

        MarketCatalogItem:
            type: object
            properties:
                item_id:
                    type: integer
                title:
                    type: string
                category:
                    type: string
                price:
                    type: number
                stock:
                    type: integer
                image_url:
                    type: string

        PurchaseRequest:
            type: object
            required:
                - itemId
                - quantity
            properties:
                itemId:
                    type: integer
                    minimum: 1
                quantity:
                    type: integer
                    minimum: 1

        Item:
            type: object
            properties:
                id:
                    type: integer
                title:
                    type: string
                description:
                    type: string
                    nullable: true
                price:
                    type: number
                    nullable: true
                stock:
                    type: integer
                image_url:
                    type: string
                status:
                    type: string
                    enum: [active, sold, hidden]
                file_id:
                    type: string
                    nullable: true
                    description: ImageKit file identifier, used for delete/replace.
                item_categories:
                    type: array
                    items:
                        type: object
                        properties:
                            item_id:
                                type: integer
                            category_id:
                                type: integer
                            category:
                                type: object
                                properties:
                                    id:
                                        type: integer
                                    cat_name:
                                        type: string
                                    cat_type:
                                        type: string
                create_at:
                    type: string
                    format: date-time
                updated_at:
                    type: string
                    format: date-time

        ItemCreateRequest:
            type: object
            required:
                - title
                - image
            properties:
                title:
                    type: string
                description:
                    type: string
                price:
                    type: number
                    description: Set for market items, null for media items.
                stock:
                    type: integer
                    default: 0
                category_ids:
                    type: string
                    description: "JSON-encoded array of category IDs, e.g. '[1,2]'. May be omitted/empty to create an item with zero categories."
                status:
                    type: string
                    enum: [active, sold, hidden]
                    default: active
                image:
                    type: string
                    format: binary

        ItemUpdateRequest:
            type: object
            properties:
                title:
                    type: string
                description:
                    type: string
                price:
                    type: number
                    nullable: true
                stock:
                    type: integer
                category_ids:
                    type: string
                    description: "JSON-encoded array of category IDs, e.g. '[1,2]'"
                status:
                    type: string
                    enum: [active, sold, hidden]
                image:
                    type: string
                    format: binary

        # ---- Response envelopes ----
        # Every backend response is wrapped in { success, data } or
        # { success, message } — these schemas model that honestly instead of
        # returning bare arrays/objects.

        SuccessResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                message:
                    type: string

        ErrorResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: false
                message:
                    oneOf:
                        - type: string
                        - type: array
                          items:
                              type: string

        ItemResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                data:
                    $ref: '#/components/schemas/Item'

        ItemListResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/Item'

        MarketCatalogListResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/MarketCatalogItem'
